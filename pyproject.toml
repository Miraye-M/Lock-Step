[project]
name = "specify-cli"
version = "2.0.0.dev0"
description = "Lockstep: evidence-gated ACC-to-ACS vulnerability remediation, derived from GitHub Spec Kit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.24.0",
    "click>=8.5.0",
    "rich",
    "pyyaml>=6.0",
    "packaging>=23.0",
    "json5>=0.13.0",
    "mcp>=2.2.0,<3.0.0",
    "pydantic>=2.13.0,<3.0.0",
]

[project.urls]
Repository = "https://github.com/Miraye-M/Lock-Step"
Issues = "https://github.com/Miraye-M/Lock-Step/issues"
Upstream = "https://github.com/github/spec-kit"

[project.scripts]
specify = "specify_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specify_cli"]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff==0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.ruff.lint]
# Lock in subprocess security posture: any reintroduction of shell=True
# (or os.system / popen2) must be acknowledged with an explicit `# noqa`
# pointing at the rule, making the deviation visible in review.
extend-select = [
    "S602",  # subprocess-popen-with-shell-equals-true
    "S604",  # call-with-shell-equals-true
    "S605",  # start-process-with-a-shell
]

name: Remediation enhancement
description: Propose an improvement to the Lockstep remediation workflow
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed behavior
      description: Explain the remediation scenario, current limitation and desired outcome.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Intake and ACC source evidence
        - ACS applicability and impact analysis
        - Plan approval and repair
        - QA, code review and security gates
        - Jenkins and AFT connectors
        - PR evidence and human review
        - CLI, Copilot or MCP integration
        - Checkpoints, recovery or documentation
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and failure cases
      description: Describe success, negative coverage, recovery behavior and offline test strategy.
    validations:
      required: true
  - type: textarea
    id: disclosure
    attributes:
      label: AI assistance disclosure
      description: Name any AI tools/models used and the extent of assistance, or enter N/A.

name: Bug report
description: Report a Lockstep remediation problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include the stage, required action and reproducible steps. Do not paste secrets or private source.
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - CLI with offline stub
        - VS Code Copilot orchestrator
        - Copilot CLI specialists
        - MCP connector integration
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Toolkit version, Python version and OS
      description: Use specify version and python --version.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized diagnostics
      description: Include relevant errors, run stage, configured mode and whether resume was attempted. Report vulnerabilities following SECURITY.md.
  - type: textarea
    id: disclosure
    attributes:
      label: AI assistance disclosure
      description: Name any AI tools/models used and the extent of assistance, or enter N/A.
